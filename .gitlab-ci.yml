include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  AST_ENABLE_MR_PIPELINES: "true"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - 安全扫描

stages:
  - test

review-tools:
  stage: test
  tags:
    - gitlab--duo
  image: local.gitlab-ci.invalid/gitlab-org/duo-workflow/default-docker-image/workflow-generic-image:v0.0.23
  script:
    - bash tools/native_review/prepare_ci_zstd.sh "$CI_PROJECT_DIR/.native-review-ci"
    - export PATH="$CI_PROJECT_DIR/.native-review-ci/bin:$PATH"
    - python3 -c "import unittest; suite=unittest.defaultTestLoader.discover('tools/native_review',pattern='test_*.py'); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)"
    - python3 -c "import ast,pathlib; files=list(pathlib.Path('tools/native_review').glob('*.py')); [ast.parse(p.read_text(),filename=str(p)) for p in files]; print('Validated',len(files),'Python sources')"

    - python3 -c "import ast,pathlib; files=list(pathlib.Path('ports/ultratears-linux').rglob('*.py')); [ast.parse(p.read_text(),filename=str(p)) for p in files]; print('Validated',len(files),'Linux overlay Python sources')"

semgrep-sast:
  image: registry.gitlab.com/security-products/semgrep@sha256:6438917354ac62eebd1a85ba7dcd6d597f1bf4613ec6ea9eb61892cf4c3b4732
  allow_failure: false

secret_detection:
  image: registry.gitlab.com/security-products/secrets@sha256:dd2449c8bf1fdb25c7e81b7128c9ada36e0b4f10c8763bd71c3a2ca8cda9e51a
  allow_failure: false

# Focused ROM-free Xbox34 tests use checked-in public sources, without pip/network.
xbox34-offline:
  stage: test
  tags:
    - macos
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    XBOX34_TEST_TMP: "$CI_PROJECT_DIR/.xbox34-test-tmp"
  script:
    - /opt/homebrew/bin/python3.15 -S -B tools/native_review/run_xbox34_ci.py
  allow_failure: false
